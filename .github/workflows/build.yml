name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA; Dependabot keeps the pins current. The comment
      # keeps the human-readable version next to the SHA.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version 2>/dev/null || echo "Command Line Tools only"

      - name: Build universal app
        run: ./build.sh

      - name: Run unit tests
        run: ./test.sh

      - name: Validate the headless scan
        run: python3 Tools/verify-json.py

      - name: Verify the bundle
        run: |
          lipo -info build/MacPulse.app/Contents/MacOS/MacPulse
          plutil -p build/MacPulse.app/Contents/Info.plist

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacPulse-app
          path: build/MacPulse.app
          if-no-files-found: error
          retention-days: 14
